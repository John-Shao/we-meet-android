# Translation gate: every supported locale must match the English default.
# Pure stdlib Python — no Android SDK, no composite build, a couple of seconds.
name: i18n-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Every locale matches res/values/
        run: python scripts/i18n.py check

      - name: Tooling regressions
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
