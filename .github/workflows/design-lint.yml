# Run the same design rules and baseline without the Android/composite build.
name: design-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-design-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew --settings-file settings.design-lint.gradle.kts checkDesignTokens --console=plain
