# JVM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# ---- We Meet config ----
# Backend base URL the app will talk to.  Override in local.properties for dev.
WE_MEET_BASE_URL=https://meet.we-meet.online
# Keycloak base URL (issuer host).  Used for the Account API (firstName sync).
# Must match the issuer that signed the backend's access_token, otherwise the
# Account API returns 401 and trips the session-expired flow.
WE_MEET_KEYCLOAK_URL=https://id.we-meet.online
# Optional override.  Leave empty in prod; the LiveKit URL is normally returned
# inside the room-detail JSON.  Useful for pointing the emulator at a self-hosted
# LiveKit (e.g. ws://10.0.2.2:7880).
WE_MEET_LIVEKIT_URL_OVERRIDE=
# La Suite Docs (云文档) — loaded in the Docs tab WebView. See p3-docs-app.md.
WE_MEET_DOCS_URL=https://docs.we-meet.online
# Keycloak OIDC public client for the in-WebView login (authorization code +
# PKCE). Must match deploy/aliyun/keycloak/bootstrap-app-client.sh in ../we-meet.
WE_MEET_OIDC_CLIENT_ID=app
# Feature switch: true = WebView Keycloak unified login (seeds the KC session
# cookie that makes the Docs tab SSO silently); false = legacy native OTP login.
WE_MEET_WEB_LOGIN=true

# ---- Getui (个推) offline push ----
# AppId/AppKey/AppSecret identify the app to the Getui service; they ship
# inside every APK (standard Getui practice) so they are fine to commit.
# The MasterSecret is server-side only and must NEVER be added here.
