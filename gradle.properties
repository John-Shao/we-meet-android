# JVM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.java.home=D\:\\Program Files\\Java\\jdk-17\\jdk-17.0.19+10

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# ---- We Meet config ----
# Backend base URL the app will talk to.  Override in local.properties for dev.
WE_MEET_BASE_URL=https://meet.we-meet.online
# Keycloak base URL (issuer host).  Used for the Account API (firstName sync).
# Must match the issuer that signed the backend's access_token, otherwise the
# Account API returns 401 and trips the session-expired flow.
WE_MEET_KEYCLOAK_URL=https://id.we-meet.online
# Optional override.  Leave empty in prod; the LiveKit URL is normally returned
# inside the room-detail JSON.  Useful for pointing the emulator at a self-hosted
# LiveKit (e.g. ws://10.0.2.2:7880).
WE_MEET_LIVEKIT_URL_OVERRIDE=
