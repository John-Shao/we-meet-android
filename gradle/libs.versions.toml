[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coroutines = "1.9.0"

# AndroidX core
coreKtx = "1.13.1"
appcompat = "1.7.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.4"
securityCrypto = "1.1.0-alpha06"
browser = "1.8.0"

# Compose
composeBom = "2024.10.01"

# CameraX
camerax = "1.4.0"

# Networking
retrofit = "2.11.0"
okhttp = "4.12.0"
moshi = "1.15.1"

# Analytics
posthog = "3.16.0"

# LiveKit — bumped to 2.24.1 to unify with the ported :feature-assistant
# (Sprint 3). compose-components 2.2.1 kept; if the build flags a core/
# components mismatch, bump livekitCompose to its 2.24-compatible release.
livekit = "2.24.1"
livekitCompose = "2.2.1"

# Image loading
coil = "2.7.0"
getuiSdk = "3.3.15.0"
getuiCore = "3.3.3.0"
zxingEmbedded = "4.3.0"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"

# Testing (JVM unit tests). org.json 是**故意**引进来的:MessageContentParser 用
# android.jar 里的 org.json,而那份在 JVM 单测里全是 `throw RuntimeException("Stub!")`。
# 把真实现放进 testImplementation 正好把 stub 盖掉,比上 Robolectric 便宜一个量级。
junit = "4.13.2"
orgJson = "20240303"

[libraries]
# Kotlin / Coroutines
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }

# Compose (via BOM)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }

# CameraX
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

# Networking
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
moshi = { module = "com.squareup.moshi:moshi", version.ref = "moshi" }
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }

# Analytics
posthog-android = { module = "com.posthog:posthog-android", version.ref = "posthog" }

# LiveKit
livekit-android = { module = "io.livekit:livekit-android", version.ref = "livekit" }
livekit-android-compose-components = { module = "io.livekit:livekit-android-compose-components", version.ref = "livekitCompose" }

# Image loading
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
getui-sdk = { module = "com.getui:gtsdk", version.ref = "getuiSdk" }
getui-core = { module = "com.getui:gtc", version.ref = "getuiCore" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingEmbedded" }
jusi-lightim-sdk-im = { module = "com.jusi.lightim:sdk-im" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
